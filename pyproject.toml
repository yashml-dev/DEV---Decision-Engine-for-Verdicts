[project]
name = "dev-decision-engine"
version = "0.1.0"
description = "DEV - Decision Engine for Verdicts: a compact multi-head decision model for ticket triage."
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "pyyaml", "fastapi", "uvicorn", "pydantic", "pytest", "httpx"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
